<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table &amp; Tap | Table QR codes</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">Table <span>&amp;</span> Tap</div><div class="table-badge">QR code generator</div></header><main class="qr-wrap"><section class="intro"><h1>Table QR codes</h1><p>Print these cards and place one on each table. Customers scan to open the menu for their table.</p></section><section class="qr-controls"><label>Number of tables<input id="count" type="number" min="1" max="100" value="10"></label><button class="primary" id="generate" style="width:auto;margin:0">Generate codes</button><button class="filter" onclick="window.print()">Print cards</button></section><section class="qr-cards" id="cards"></section></main><script>function draw(){const count=Math.min(100,Math.max(1,Number(document.querySelector('#count').value)||1));document.querySelector('#cards').innerHTML=Array.from({length:count},(_,index)=>{const table=index+1;return `<article class="qr-card"><h2>Table ${table}</h2><img src="/api/qr?table=${table}" alt="QR code for table ${table}"><p>Scan to view the menu and place an order.</p></article>`}).join('');}document.querySelector('#generate').onclick=draw;draw();</script></body></html>
